[project]
name = "auth-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.8",
    "redis>=5.0",
    "grpcio>=1.84",
    "protobuf>=7.35",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "fakeredis>=2.23", "aiosqlite>=0.20", "grpcio-tools>=1.84"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
