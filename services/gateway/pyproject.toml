[project]
name = "gateway-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "grpcio>=1.84",
    "protobuf>=7.35",
    "pyjwt[crypto]>=2.8",
    "redis>=5.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "fakeredis>=2.23", "httpx>=0.27", "grpcio-tools>=1.84"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
