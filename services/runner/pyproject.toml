[project]
name = "runner-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.4",
    "playwright>=1.56",
    "grpcio>=1.84",
    "protobuf>=7.35",
    "langgraph>=1.2",
    "langchain-core>=1.7",
    "langchain-gigachat>=0.5",
    "langchain-openai>=1.7",
    "faststream[rabbit]>=0.7",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "grpcio-tools>=1.84"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
