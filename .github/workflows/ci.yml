name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff
        run: |
          uvx ruff@0.16.8 check .
          uvx ruff@0.16.8 format --check .

  services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, projects, runs, gateway, runner]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    env:
      JWT_ALGORITHM: RS256
      JWT_ISSUER: ai-tester-auth
      JWT_AUDIENCE: ai-tester-api
      AUTH_DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/auth
      AUTH_REDIS_URL: redis://localhost:6379/0
      AUTH_ACCESS_TOKEN_TTL_MINUTES: 30
      AUTH_REFRESH_TOKEN_TTL_DAYS: 1
      AUTH_GRPC_HOST: 127.0.0.1
      AUTH_GRPC_PORT: 50051
      AUTH_LOGIN_ATTEMPTS_LIMIT: 5
      AUTH_LOGIN_BLOCK_MINUTES: 15
      GATEWAY_AUTH_GRPC_ADDRESS: 127.0.0.1:50051
      GATEWAY_PROJECTS_GRPC_ADDRESS: 127.0.0.1:50052
      GATEWAY_RUNS_GRPC_ADDRESS: 127.0.0.1:50053
      GATEWAY_REDIS_URL: redis://localhost:6379/0
      GATEWAY_COOKIE_SECURE: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Одноразовый ключ JWT для тестов auth
        if: matrix.service == 'auth'
        run: |
          {
            echo "AUTH_JWT_PRIVATE_KEY<<KEY"
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048
            echo "KEY"
          } >> "$GITHUB_ENV"
      - name: Зависимости
        run: uv sync --locked
      - name: Браузер для раннера
        if: matrix.service == 'runner'
        run: uv run playwright install --with-deps chromium
      - name: Тесты
        run: uv run pytest -q

  demo-shop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -q
