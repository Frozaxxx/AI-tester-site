<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Demo Shop{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1d1d1f; background: #fafafa; }
    header { display: flex; gap: 16px; align-items: center; padding: 12px 24px; background: #fff; border-bottom: 1px solid #e5e5e5; }
    header .logo { font-weight: 700; margin-right: auto; text-decoration: none; color: inherit; }
    main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    footer { max-width: 900px; margin: 48px auto 24px; padding: 0 16px; color: #6e6e73; display: flex; gap: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; list-style: none; padding: 0; }
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 16px; }
    .price { font-weight: 600; }
    nav.pagination { display: flex; gap: 8px; margin-top: 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    td, th { padding: 8px; border-bottom: 1px solid #e5e5e5; text-align: left; }
    form.stack { display: grid; gap: 12px; max-width: 400px; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/products">Demo Shop</a>
    <form action="/search" method="get" role="search">
      <input name="q" placeholder="Поиск товаров" aria-label="Поиск товаров">
      <button type="submit">Найти</button>
    </form>
    <a href="/products">Каталог</a>
    <a href="/cart">Корзина ({{ cart_count }})</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <a href="/delivery">Доставка и оплата</a>
    <span>© Demo Shop</span>
  </footer>
</body>
</html>
