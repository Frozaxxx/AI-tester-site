{% extends "base.html" %}
{% block title %}{{ product.name }} — Demo Shop{% endblock %}
{% block content %}
  <article class="card">
    <h1>{{ product.name }}</h1>
    <p>{{ product.description }}</p>
    <p class="price">{{ "{:,}".format(product.price).replace(",", " ") }} ₽</p>
    <form action="/cart/add" method="post">
      <input type="hidden" name="product_id" value="{{ product.id }}">
      <label>Количество <input type="number" name="quantity" value="1" min="1" max="99"></label>
      <button type="submit">В корзину</button>
    </form>
    <p><button type="button" onclick="addToFavorites({{ product.id }})">В избранное</button></p>
  </article>
{% endblock %}
